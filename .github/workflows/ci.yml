name: Super Bandits CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/*, chore/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  # Phase 1: Code Quality and Contamination Scanning

  # Phase 2: Code Quality and Contamination Scanning
  quality-scan:
    runs-on: ubuntu-latest
    needs: setup
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff black isort mypy pytest-cov
    
    - name: Run contamination scanner
      run: |
        python enhanced_contamination_scanner.py
        echo "Contamination scan completed"
    
    - name: Run code formatting check
      run: |
        black --check --diff . || echo "⚠️ Black formatting issues found"
        isort --check-only --diff . || echo "⚠️ Import sorting issues found"
    
    - name: Run linting
      run: |
        ruff check . --output-format=github
    
    - name: Run type checking
      run: |
        mypy CORE_SUPER_BANDITS/ --ignore-missing-imports

  # Phase 3: Unit Tests and Algorithm Validation
  unit-tests:
    runs-on: ubuntu-latest
    needs: setup
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-xdist
    
    - name: Run unit tests
      env:
        ALLOW_LOW_DIVERSITY: "1"
      run: |
        pytest tests/ -v --tb=short --cov=CORE_SUPER_BANDITS --cov-report=xml --cov-report=html
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  # Phase 4: Integration Tests and System Validation
  integration-tests:
    runs-on: ubuntu-latest
    needs: setup
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Run integration tests
      env:
        ALLOW_LOW_DIVERSITY: "1"
      run: |
        pytest tests/test_phase1_diversity_validation.py -v --tb=short
        pytest tests/test_day4_personality_integration.py -v --tb=short
    
    - name: Run system validation
      run: |
        python -c "
        from CORE_SUPER_BANDITS.optimized_linucb_institutional import OptimizedInstitutionalLinUCB
        from CORE_SUPER_BANDITS.optimized_neural_bandit_institutional import OptimizedInstitutionalNeuralBandit
        from CORE_SUPER_BANDITS.optimized_ucbv_institutional import OptimizedInstitutionalUCBV
        import numpy as np
        
        # Test all algorithms
        linucb = OptimizedInstitutionalLinUCB()
        neural = OptimizedInstitutionalNeuralBandit()
        ucbv = OptimizedInstitutionalUCBV()
        
        # Test with sample data
        features = np.random.random(15) * 2 - 1
        arm_id = 'test_arm'
        
        linucb_conf = linucb.get_confidence_for_context(arm_id, features)
        neural_conf = neural.get_confidence_for_context(arm_id, features)
        ucbv_conf = ucbv.get_confidence_for_context(arm_id, features, features)
        
        print(f'LinUCB confidence: {linucb_conf}')
        print(f'Neural confidence: {neural_conf}')
        print(f'UCB-V confidence: {ucbv_conf}')
        
        # Validate bounds
        assert 0.45 <= linucb_conf <= 0.95, f'LinUCB out of bounds: {linucb_conf}'
        assert 0.45 <= neural_conf <= 0.95, f'Neural out of bounds: {neural_conf}'
        assert 0.45 <= ucbv_conf <= 0.95, f'UCB-V out of bounds: {ucbv_conf}'
        
        print('✅ All algorithms working correctly!')
        "

  # Phase 5: Performance and Load Testing
  performance-tests:
    runs-on: ubuntu-latest
    needs: setup
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-benchmark
    
    - name: Run performance tests
      run: |
        pytest tests/ -k "performance" -v --benchmark-only --benchmark-sort=mean
    
    - name: Run load tests
      run: |
        python -c "
        import time
        import numpy as np
        from CORE_SUPER_BANDITS.optimized_linucb_institutional import OptimizedInstitutionalLinUCB
        
        # Load test
        linucb = OptimizedInstitutionalLinUCB()
        start_time = time.time()
        
        for i in range(1000):
            features = np.random.random(15) * 2 - 1
            arm_id = f'test_arm_{i}'
            conf = linucb.get_confidence_for_context(arm_id, features)
        
        end_time = time.time()
        duration = end_time - start_time
        
        print(f'Processed 1000 requests in {duration:.2f} seconds')
        print(f'Average time per request: {duration/1000*1000:.2f}ms')
        
        assert duration < 10.0, f'Performance test failed: {duration}s > 10s'
        print('✅ Performance test passed!')
        "

  # Phase 6: Security and Compliance Scanning
  security-scan:
    runs-on: ubuntu-latest
    needs: setup
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install safety bandit
    
    - name: Run safety scan
      run: |
        safety scan --json > safety-report.json
        safety scan --full-report
    
    - name: Run bandit security scan
      run: |
        bandit -r CORE_SUPER_BANDITS/ -f json -o bandit-report.json
        bandit -r CORE_SUPER_BANDITS/

    - name: Print Bandit report to logs
      if: ${{ always() }}
      run: |
        echo "Bandit JSON findings (if any):"
        if [ -f bandit-report.json ]; then
          cat bandit-report.json
        else
          echo "bandit-report.json not found"
        fi
    
    - name: Upload security reports
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          safety-report.json
          bandit-report.json

  # Phase 7: Documentation and Build Validation
  docs-build:
    runs-on: ubuntu-latest
    needs: setup
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install sphinx sphinx-rtd-theme
    
    - name: Build documentation
      run: |
        if [ -f "docs/conf.py" ]; then
          cd docs
          make html
        else
          echo "No documentation to build"
        fi
    
    - name: Upload documentation
      if: ${{ hashFiles('docs/_build/html/index.html') != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: docs/_build/html/

  # Phase 8: Final Validation and Reporting
  final-validation:
    runs-on: ubuntu-latest
    needs: [quality-scan, unit-tests, integration-tests, performance-tests, security-scan, docs-build]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run final system validation
      run: |
        echo "🔍 Running final system validation..."
        
        # Test all core components
        python -c "
        import sys
        import traceback
        
        try:
            from CORE_SUPER_BANDITS.optimized_linucb_institutional import OptimizedInstitutionalLinUCB
            from CORE_SUPER_BANDITS.optimized_neural_bandit_institutional import OptimizedInstitutionalNeuralBandit
            from CORE_SUPER_BANDITS.optimized_ucbv_institutional import OptimizedInstitutionalUCBV
            import numpy as np
            
            print('✅ All imports successful')
            
            # Test algorithm instantiation
            linucb = OptimizedInstitutionalLinUCB()
            neural = OptimizedInstitutionalNeuralBandit()
            ucbv = OptimizedInstitutionalUCBV()
            
            print('✅ All algorithms instantiated')
            
            # Test confidence calculations
            features = np.random.random(15) * 2 - 1
            arm_id = 'final_test_arm'
            
            linucb_conf = linucb.get_confidence_for_context(arm_id, features)
            neural_conf = neural.get_confidence_for_context(arm_id, features)
            ucbv_conf = ucbv.get_confidence_for_context(arm_id, features, features)
            
            print(f'✅ LinUCB confidence: {linucb_conf}')
            print(f'✅ Neural confidence: {neural_conf}')
            print(f'✅ UCB-V confidence: {ucbv_conf}')
            
            # Validate bounds
            assert 0.45 <= linucb_conf <= 0.95, f'LinUCB out of bounds: {linucb_conf}'
            assert 0.45 <= neural_conf <= 0.95, f'Neural out of bounds: {neural_conf}'
            assert 0.45 <= ucbv_conf <= 0.95, f'UCB-V out of bounds: {ucbv_conf}'
            
            print('✅ All confidence bounds valid')
            print('🎉 Final validation PASSED!')
            
        except Exception as e:
            print(f'❌ Final validation FAILED: {e}')
            traceback.print_exc()
            sys.exit(1)
        "
    
    - name: Generate test summary
      run: |
        echo "📊 Test Summary:"
        echo "=================="
        echo "Quality Scan: ${{ needs.quality-scan.result }}"
        echo "Unit Tests: ${{ needs.unit-tests.result }}"
        echo "Integration Tests: ${{ needs.integration-tests.result }}"
        echo "Performance Tests: ${{ needs.performance-tests.result }}"
        echo "Security Scan: ${{ needs.security-scan.result }}"
        echo "Documentation: ${{ needs.docs-build.result }}"
        echo "=================="
        
        if [ "${{ needs.quality-scan.result }}" = "success" ] && 
           [ "${{ needs.unit-tests.result }}" = "success" ] && 
           [ "${{ needs.integration-tests.result }}" = "success" ] && 
           [ "${{ needs.performance-tests.result }}" = "success" ] && 
           [ "${{ needs.security-scan.result }}" = "success" ]; then
          echo "🎉 ALL TESTS PASSED! System is ready for production."
        else
          echo "⚠️ Some tests failed. Please review the logs above."
        fi