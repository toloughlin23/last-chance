# ZERO TOLERANCE Pre-commit Configuration
# This ensures NO RANDOM DATA or MOCK DATA ever enters our codebase

repos:
  # Contamination Scanner - MUST PASS
  - repo: local
    hooks:
      - id: contamination-scanner
        name: Zero Tolerance Contamination Scanner
        entry: python enhanced_contamination_scanner.py
        language: system
        pass_filenames: false
        always_run: true
        fail_fast: true
        verbose: true
        description: "Detects and prevents ANY random data, mock data, or placeholders"

  # Code Quality
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        args: [--line-length=120]

  # Import Sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=120]

  # Linting
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: [--max-line-length=120, --extend-ignore=E203]

  # Security Scanning
  - repo: https://github.com/pycqa/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        args: [-r, .]
        exclude: ^tests/

  # Type Checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [types-requests, numpy]

# Configuration
fail_fast: true  # Stop on first failure
default_stages: [commit, push]